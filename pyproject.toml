[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synaplang"
version = "0.1.0"
description = "SynapLang: AI-Native Programming Language targeting WebAssembly"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "SynapLang Open Source Community"}
]
dependencies = [
    "lark>=1.1.0",
    "wasmtime>=20.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0"
]

[project.scripts]
synap = "src.cli:main"
ail = "src.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
