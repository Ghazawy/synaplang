<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SynapLang Playground - AI-Native Language for LLMs</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="logo">
      <span class="icon">⚡</span>
      <span class="brand">Synap<strong>Lang</strong></span>
      <span class="badge">v0.3.0 Wasm</span>
    </div>
    <div class="nav-links">
      <a href="https://github.com/Ghazawy/synaplang" target="_blank" class="github-btn">
        <svg height="18" width="18" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
        </svg>
        GitHub Repository
      </a>
    </div>
  </header>

  <main class="container">
    <aside class="sidebar">
      <div class="sidebar-header">Presets & Examples</div>
      <div class="example-list">
        <button class="example-btn active" data-example="fibonacci">⚡ Fibonacci (Recursion)</button>
        <button class="example-btn" data-example="factorial">🔄 Factorial (While Loop)</button>
        <button class="example-btn" data-example="arrays">📊 Dynamic Memory Arrays</button>
        <button class="example-btn" data-example="structs">🏛️ Records & Structs</button>
        <button class="example-btn" data-example="strings">💬 String Concat & Host Print</button>
        <button class="example-btn" data-example="self_healing">🩺 Self-Healing Diagnostics</button>
      </div>

      <div class="stats-panel">
        <div class="stat-item">
          <span class="stat-label">Grammar:</span>
          <span class="stat-value">Homoiconic S-Expr</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Target Engine:</span>
          <span class="stat-value">WebAssembly JIT</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Tokens:</span>
          <span class="stat-value" id="token-counter">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Syntax Fragility:</span>
          <span class="stat-value green">0% (No Tabs/Spaces)</span>
        </div>
      </div>
    </aside>

    <section class="workspace">
      <div class="panel-header">
        <div class="panel-title">
          <span class="dot"></span>
          <span>SynapLang Source (.ail)</span>
        </div>
        <div class="actions">
          <button id="btn-run" class="btn btn-primary">▶ Run in WebAssembly</button>
          <button id="btn-toggle-wat" class="btn btn-secondary">🔍 View WebAssembly WAT</button>
        </div>
      </div>

      <div class="editor-container">
        <textarea id="code-editor" spellcheck="false"></textarea>
      </div>

      <div class="console-panel">
        <div class="console-header">
          <span>Execution Output & Diagnostics</span>
          <span id="exec-time" class="exec-badge">Ready</span>
        </div>
        <pre id="console-output"></pre>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
